[project]
name = "custom-tools-python"
version = "0.2.0"
description = "Houdini custom_tools Python pipeline (LOPs builder, HMCP, integrations)"
requires-python = ">=3.10"
readme = "README.md"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".venv",
    "HMCP/.venv",
    "tools/jltools_decompiled",
    "tools/_archive",
    "tools/lops_asset_builder_v3/componentoutput_custom.py",
    "tools/lops_asset_builder_v3/subnet_lookdev_setup.py",
    "**/__pycache__",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"HMCP/server.py" = ["E402"]
"tools/**" = ["F403", "F405"]

[tool.ruff.format]
quote-style = "double"
